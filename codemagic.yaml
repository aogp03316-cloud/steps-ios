workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        SCHEME: Steps
    scripts:
      - name: Install xcodegen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build unsigned app
        script: |
          xcodebuild -project Steps.xcodeproj -scheme Steps -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Steps.app Payload/
          zip -qr Steps-unsigned.ipa Payload
          ls -lh Steps-unsigned.ipa
    artifacts:
      - Steps-unsigned.ipa