name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Steps.xcodeproj \
            -scheme Steps \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tail -40

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Steps.app Payload/
          zip -qr Steps-unsigned.ipa Payload
          ls -lh Steps-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Steps-unsigned-ipa
          path: Steps-unsigned.ipa
          retention-days: 7
